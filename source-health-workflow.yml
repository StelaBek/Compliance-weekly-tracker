name: Source health
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python services_source_health.py
        env:
          COMPLIANCE_DB_PATH: compliance.db
